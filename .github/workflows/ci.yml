name: ci

# Two jobs, deliberately separated by what they touch.
#
#   gate — every suite, offline, on every push and pull request. No network, no secrets, no env:
#          `src/config.ts` falls back to the Hideki defaults so a bare checkout is a complete
#          configuration, and the suites reach only loopback servers they spawn themselves
#          (`backtest-repro.test.ts`) or a `t.mock`'d fetch. Nothing in `pnpm gate` may change that:
#          a gate that needs the venue is a gate that goes red when the venue hiccups.
#   live — read-only against Somnia Hideki (50383), on a schedule, on main, and by hand. This is
#          where drift gets caught: a market list that changes, an indexer that starts refusing a
#          query shape, an arithmetic invariant that breaks against real settlement data. It never
#          blocks a pull request, and it never holds a credential — every call it makes is a read.
#   deploy — builds the static site and the one serverless function, and ships them to Vercel.
#          INERT BY CONSTRUCTION: it is skipped until the repository variable
#          `VERCEL_DEPLOY_ENABLED` is set to `true`, which is what the state is until a project
#          exists. Publishing does not change what the tool may do: the deployed function reads the
#          indexer and the chain the same read-only way, holds no key, signs nothing and submits
#          nothing. What publishing does change is who can ask it to work — see
#          docs/deployment-vercel.md on the per-instance lane cap.
#
# `pnpm test:guards` (the src/web mutation harness) is in neither job: it re-runs a test file per
# injection and costs minutes. Run it when a render guard changes; see AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Live backtest window, in days"
        required: false
        default: "14"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, every suite (src/test-reach.test.ts fails the run if a test file or a whole
      # suite stops being reachable from `pnpm gate`), then the browser bundle.
      - run: pnpm run gate

  live:
    name: live read-only chain check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned so a default changing in `src/config.ts` cannot quietly repoint the nightly at
      # another network. No key belongs here: this job reads, signs and sends nothing.
      CHAIN_ID: "50383"
      INDEXER_URL: "https://hideki-dev.smk.somnia.host/v1/graphql"
      RPC_URL: "https://api.hideki2.infra.testnet.somnia.network"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 1. The venue identity: perp markets as the indexer lists them, on the chain named above.
      - run: pnpm probe:markets
      # 2. Market resolution plus the on-chain state and system config behind a pre-trade check.
      - run: pnpm preflight
      # 3. The whole read path over real settlement and candle history, and the invariants over
      #    what it computes. Exit 1 is a read failure, 2 is an invariant breach; both are red.
      - name: pnpm backtest
        run: pnpm backtest --days "${{ github.event.inputs.days || '7' }}"

  deploy:
    name: vercel deploy (static site + one function)
    needs: gate
    # A repository *variable*, not a secret: `secrets` is not readable in a job-level `if`, and the
    # question this condition answers is "is there a project to ship to", which is state, not a
    # credential. Until somebody sets it, the job is skipped and the pipeline is two jobs.
    # The fork clause keeps a pull request from a fork from starting a job whose secrets it must not
    # receive; it fails red otherwise, which would read as a broken pipeline rather than an unbuilt one.
    if: vars.VERCEL_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        run: |
          # pnpm 12 refuses any global install until its global bin dir is already on PATH, and
          # `pnpm bin -g` is gated on that same check, so the directory has to be chosen here
          # rather than discovered from pnpm. Both layouts are exported because the bin dir is
          # $PNPM_HOME on some platforms and $PNPM_HOME/bin on others.
          export PNPM_HOME="$HOME/.pnpm-home"
          mkdir -p "$PNPM_HOME" "$PNPM_HOME/bin"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$PNPM_HOME:$PNPM_HOME/bin:$PATH"
          pnpm add -g vercel
          vercel --version
      # A pull request gets a preview on its own host; a push to main is the production alias. The
      # function derives the host it accepts requests from per invocation, so nothing here has to
      # know a preview URL in advance — see api/[...all].ts.
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "environment=development" >> "$GITHUB_OUTPUT"
            echo "production=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "production=--prod" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull project settings
        run: vercel pull --yes --environment="${{ steps.target.outputs.environment }}" --token "$VERCEL_TOKEN"
      # Built here, not on the platform, so what ships is what this job's `gate` tested.
      - name: Build site and function
        run: vercel build ${{ steps.target.outputs.production }} --token "$VERCEL_TOKEN"
      # The deployed catch-all matched only one path segment, so every depth>=3 API path 404'd at
      # the edge while depth-2 worked. This is the route table Vercel actually generated from api/:
      # it shows whether the per-route function files now cover the deep wallet paths, and is the
      # instrument that confirms the routing mechanism rather than guessing at it.
      - name: Show the generated route table
        run: cat .vercel/output/config.json
      - name: Deploy the build output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.production }} --token "$VERCEL_TOKEN")
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "## Deployed ${url}" >> "$GITHUB_STEP_SUMMARY"
      # G1 regression guard. Both probes are answered by the handler before any chain read, so they
      # are deterministic and do not couple the deploy to indexer availability. Before the per-route
      # function files existed, these depth>=3 paths 404'd at the edge (X-Vercel-Error: NOT_FOUND)
      # instead of reaching the app. A 400 here proves the deep route reached the handler; a 404 is
      # the routing fault returning, and fails the job.
      - name: Probe the deployed deep routes
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          url="$DEPLOY_URL"
          fail=0
          # Depth-4: paths=5 is refused by parameter validation -> app 400, not an edge 404.
          c1=$(curl -s -o /tmp/p1.json -D /tmp/h1.txt -w "%{http_code}" --max-time 60 "$url/api/accounts/0x0000000000000000000000000000000000000000/resample?paths=5")
          echo "depth-4 resample?paths=5 -> HTTP $c1"; cat /tmp/p1.json; echo
          if [ "$c1" != "400" ]; then echo "FAIL: expected app 400, got $c1"; grep -i x-vercel-error /tmp/h1.txt || true; fail=1; fi
          # Depth-3: an invalid address is refused before any read -> app 400, not an edge 404.
          c2=$(curl -s -o /tmp/p2.json -D /tmp/h2.txt -w "%{http_code}" --max-time 60 "$url/api/accounts/not-an-address/reconcile")
          echo "depth-3 reconcile (bad address) -> HTTP $c2"; cat /tmp/p2.json; echo
          if [ "$c2" != "400" ]; then echo "FAIL: expected app 400, got $c2"; grep -i x-vercel-error /tmp/h2.txt || true; fail=1; fi
          exit "$fail"
